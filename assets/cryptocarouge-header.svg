    <circle cx="840" cy="100" r="5"/><circle cx="1140" cy="140" r="5"/>
    <circle cx="70" cy="260" r="5"/><circle cx="340" cy="210" r="5"/>
    <circle cx="870" cy="255" r="5"/><circle cx="1140" cy="215" r="5"/>
  </g>
  <g filter="url(#glow)">
